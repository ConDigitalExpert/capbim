# qc-thresholds.yaml  (v2, 2026-10-11)
# Pass/fail thresholds per stage and space class for the capture-to-BIM pipeline.
# Tagging: [est] = estimated by analysis (see PLAN-v2.md accuracy ledger); [src] = sourced figure.
# Rule: an agent may change processing PARAMETERS inside a stage's retry ladder; it may NOT edit this file.
# Statistic conventions: "rmse" = root-mean-square of signed residuals; "p95" = 95th percentile of |residual|;
# "abs_max" = largest |residual|. A "±X mm" accuracy claim means p95 <= X mm (≈ USIBD 95% confidence).

version: 2
space_classes:
  S: {name: small room,   longest_dim_m: 8,  area_m2_max: 60,   images_expected: [60, 150]}
  M: {name: medium space, longest_dim_m: 20, area_m2_max: 300,  images_expected: [150, 400]}
  L: {name: large hall,   longest_dim_m: 60, area_m2_max: 3000, images_expected: [300, 1200]}

stage_00_plan:
  predicted_target_precision_mm_max: {S: 0.5, M: 0.8, L: 1.5}      # Fraser formula, q=1.0, k>=6 [est]
  predicted_surface_precision_mm_max: {S: 1.5, M: 2.5, L: 5.0}     # 1-3 x GSD rule [est]
  gsd_mm_max_at_walls: {S: 0.8, M: 1.2, L: 2.5}
  targets_min: {S: 20, M: 40, L: 80}
  scalebars_total_min: {S: 4, M: 6, L: 8}
  scalebars_heldout_min: {S: 1, M: 2, L: 3}                        # "check bars" never used as control
  level_datum_targets_min: 4                                       # targets on the laser-level line, >=3 walls
  independent_checks_min: {S: 10, M: 20, L: 40}
  survey_control_required: {S: false, M: optional, L: true}        # total station or TLS for L

stage_01_capture:
  image_count_min: {S: 60, M: 150, L: 300}
  exif:
    focal_length_values_max: 1          # one prime, no zoom change
    iso_max: 800
    aperture_f_range: [5.6, 11]
    shutter_s_max_handheld: 0.004       # 1/250 s with flash; tripod frames exempt [est]
    image_stabilisation: off
  blur_reject_fraction_max: 0.05        # variance-of-Laplacian below per-job threshold [est]
  clipped_highlight_fraction_max: 0.02
  targets_detected_fraction_min: 0.95   # of targets placed, detected in >=4 images
  scalebar_cert_uncertainty_mm_max: 0.1 # from calibration certificate [src: vendor cert]
  checks_sealed: true                   # independent measurements hashed and sealed before processing

stage_02_onsite_qc:                     # low-res alignment before leaving site (downscale 4)
  aligned_fraction_min: 0.97
  components_max: 1
  targets_ge4_projections_fraction_min: 0.95
  scalebar_residual_abs_mm_max: {S: 2.0, M: 3.0, L: 5.0}
  coverage_gap_max_m2: {S: 0.5, M: 1.0, L: 4.0}                    # largest unobserved patch on walls/floor [est]

stage_03_alignment:
  aligned_fraction_min: {S: 0.98, M: 0.97, L: 0.95}
  components_max: 1
  tiepoint_rms_reproj_px_max: 0.5       # after gradual selection
  gradual_selection:                    # applied in this order, then re-optimise
    reconstruction_uncertainty_max: 10
    projection_accuracy_max: 3
    reprojection_error_max: 0.3
    min_image_count: 3
  marker_rms_reproj_px_max: 0.3
  marker_projections_min: 4
  median_tiepoints_per_image_min: 1500  # [est]
  calibration:
    f_stderr_px_max: 1.0                # [est]
    cx_cy_stderr_px_max: 1.0            # [est]
    param_correlation_abs_max: 0.95     # any pair among f,cx,cy,k1..k3,p1,p2 [est]
    focus_groups_max: 1                 # one calibration group unless focus was changed deliberately

stage_04_scale_and_datum:
  control_bar_residual_rms_mm_max: {S: 0.5, M: 1.0, L: 1.5}        # [est]
  control_bar_residual_abs_mm_max: {S: 1.0, M: 2.0, L: 3.0}
  check_bar_residual_abs_mm_max:   {S: 1.0, M: 1.5, L: 2.5}        # held-out bars
  level_datum_z_residual_abs_mm_max: {S: 1.0, M: 1.5, L: 3.0}
  survey_control_rmse_mm_max: {M: 2.0, L: 3.0}                     # when total-station coordinates are used
  survey_check_rmse_mm_max:   {M: 2.5, L: 4.0}                     # held-out surveyed targets
  long_diagonal_check_abs_mm_max: {S: 2.0, M: 3.0, L: 5.0}         # laser/TS distance across the space

stage_05_dense_mesh_texture:
  mesh_vs_tiepoints_median_mm_max: {S: 1.0, M: 1.5, L: 2.5}        # [est]
  mesh_vs_tiepoints_p95_mm_max:    {S: 3.0, M: 4.0, L: 6.0}
  mesh_vs_marker_centres_rmse_mm_max: {S: 1.0, M: 1.5, L: 2.5}
  hole_area_fraction_max: 0.02
  texture_px_per_mm_min_walls: {S: 1.0, M: 0.5, L: 0.25}
  tls_fusion:                                                       # optional premium path
    scan_to_photo_registration_rms_mm_max: 2.0
    scan_to_scan_registration_rms_mm_max: 2.0
  gaussian_splats:                                                  # optional, visuals only
    heldout_psnr_db_min: 25            # [est]
    pose_frame_identity_required: true  # trained on the Stage-03 camera solution

stage_06_geometry_extraction:
  plane_fit_rms_mm_max: {S: 1.5, M: 2.5, L: 4.0}                   # [est]
  plane_inlier_fraction_min: 0.90
  expected_elements_found_fraction_min: 0.95                        # vs. Stage-00 expected list (walls, floor, ceiling)
  wall_to_wall_vs_check_abs_mm_max: {S: 3.0, M: 4.0, L: 6.0}
  deviation_within_5mm_area_fraction_min: {S: 0.95, M: 0.90, L: 0.85}
  deviation_within_10mm_area_fraction_min: {S: 0.99, M: 0.98, L: 0.95}

stage_07_semantics_attributes:
  required_attributes_filled_fraction_min: 1.0                      # filled or explicitly "unknown" with reason
  auto_accept_confidence_min: 0.85
  review_queue_resolved_required: true
  evidence_images_per_element_min: 2

stage_08_bim_authoring:
  ifc_schema_validation_errors_max: 0
  ids_required_facets_pass_fraction_min: 1.0
  element_count_matches_extraction: true
  ifc_vs_mesh_p95_mm_max: {S: 4.0, M: 5.0, L: 8.0}                  # represented vs measured [est]
  rvt_roundtrip_element_count_match: true                           # if RVT delivered

stage_09_browser_delivery:
  first_load_s_max: 10                                              # 100 Mbit/s, laptop [est]
  bundle_mb_max: {S: 300, M: 600, L: 1500}
  measurement_tool_vs_ifc_abs_mm_max: 0.5                           # viewer arithmetic, not survey accuracy
  pset_visible_sampled_elements_fraction_min: 1.0
  required_features_present: true
  playwright_suite_pass_required: true

stage_10_blind_validation:
  checks_used_min: {S: 10, M: 20, L: 40}
  rmse_mm_max: {S: 2.0, M: 2.5, L: 5.0}                             # photogrammetry-only L; see L_hybrid
  p95_abs_mm_max: {S: 4.0, M: 5.0, L: 10.0}
  abs_max_mm_max: {S: 6.0, M: 8.0, L: 15.0}
  L_hybrid: {rmse_mm_max: 3.0, p95_abs_mm_max: 6.0, abs_max_mm_max: 10.0}   # TLS-fused or survey-controlled hall
  retune_after_unseal_allowed: false
